openapi: 3.1.0
info:
    title: Gateway API
    description: API for the Gateway
    version: 1.0.0
paths:
    /ping:
        get:
            summary: Ping endpoint
            description: Returns a simple message
            operationId: Ping
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PingResponse'
    /v1/users:
        post:
            summary: Register a new user
            description: Creates a new user account
            operationId: RegisterUser
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserRegistration'
            responses:
                '201':
                    description: User successfully created
                    headers:
                        Set-Cookie:
                            required: true
                            schema:
                                type: string
                                example: 'auth_token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=3600'
                '400':
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /v1/users/me:
        post:
            summary: Authenticates user
            description: Checks credentials and sets necessary cookies
            operationId: AuthUser
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UsernameAndPassword'
            responses:
                200:
                    description: Authenticated user
                    headers:
                        Set-Cookie:
                            required: true
                            schema:
                                type: string
                                example: 'auth_token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=3600'
                400:
                    description: Bad credentials
        get:
            summary: Info about logged user
            operationId: GetMyProfile
            responses:
                '200':
                    description: User profile
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileResponse'
                '401':
                    description: Unauthorized
        patch:
            summary: Edit user profile
            operationId: EditMyProfile
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EditProfile'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileResponse'
                '401':
                    description: Unauthorized

    /v1/posts:
        post:
            summary: Create a post
            operationId: CreatePost
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePostRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Post'
                '400':
                    description: Bad request
                '401':
                    description: Not authenticated
        get:
            summary: Get a post
            operationId: GetPost
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostId'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Post'
                '400':
                    description: Bad request
                '401':
                    description: Not authenticated
                '403':
                    description: Not authorized
                '404':
                    description: Post not found
        patch:
            summary: Edit a post
            operationId: EditPost
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EditPostRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Post'
                '400':
                    description: Bad request
                '401':
                    description: Not authenticated
                '403':
                    description: Not authorized
                '404':
                    description: Post not found
        delete:
            summary: Delete a post
            operationId: DeletePost
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostId'
            responses:
                '200':
                    description: OK
                '401':
                    description: Not authenticated
                '403':
                    description: Not authorized
                '404':
                    description: Post not found

    /v1/posts/list:
        post:
            summary: Get paginated list of posts
            operationId: GetPostsList
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaginatedPostsRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PostsList'
                '401':
                    description: Not authenticated

    /v1/posts/like:
        post:
            summary: Like/unlike a post
            operationId: LikePost
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostId'
            responses:
                '200':
                    description: OK (even if the post is not found or not authorized)
                '401':
                    description: Not authenticated

    /v1/posts/comments:
        post:
            summary: Create a comment
            operationId: PostComment
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCommentRequest'
            responses:
                '200':
                    description: OK
                '400':
                    description: Bad request
                '401':
                    description: Not authenticated
                '403':
                    description: Not authorized
                '404':
                    description: Post not found
    
    /v1/posts/comments/list:
        post:
            summary: Get paginated list of comments
            operationId: GetCommentsList
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaginatedCommentsRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommentsList'
                '400':
                    description: Bad request
                '401':
                    description: Not authenticated
                '403':
                    description: Not authorized
                '404':
                    description: Post not found

    /v1/post/stats:
        post:
            summary: Get post stats
            operationId: GetPostStats
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostStatsRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PostStats'
                '401':
                    description: Not authenticated
                '404':
                    description: Post not found

    /v1/post/dynamics:
        post:
            summary: Get post dynamics
            operationId: GetPostDynamics
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostDynamicsRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PostDynamics'
                '401':
                    description: Not authenticated
                '404':
                    description: Post not found
    
    /v1/post/top:
        post:
            summary: Get top posts
            operationId: GetTopPosts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TopPostsRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TopPosts'
                '401':
                    description: Not authenticated

    /v1/users/top:
        post:
            summary: Get top users
            operationId: GetTopUsers
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TopUsersRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TopUsers'
                '401':
                    description: Not authenticated
                '404':
                    description: Post not found

components:
    schemas:
        PingResponse:
            type: object
            required:
                - message
            properties:
                message:
                    type: string

        Error:
            type: object
            required:
                - code
                - message
            properties:
                code:
                    type: string
                message:
                    type: string

        UserRegistration:
            type: object
            required:
                - username
                - password
                - email
            properties:
                username:
                    type: string
                    example: john_doe
                password:
                    type: string
                    format: password
                    example: Pa$$w0rd
                email:
                    type: string
                    format: email
                    example: john.doe@example.com

        ProfileResponse:
            type: object
            required:
                - id
                - username
                - email
                - last_login
            properties:
                id:
                    type: string
                    format: uuid
                username:
                    type: string
                email:
                    type: string
                full_name:
                    type: string
                date_of_birth:
                    type: string
                    example: '2004-03-29'
                phone_number:
                    type: string
                last_login:
                    type: string
                    example: '2004-03-29 12:30'

        UsernameAndPassword:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                password:
                    type: string

        EditProfile:
            type: object
            properties:
                full_name:
                    type: string
                date_of_birth:
                    type: string
                    format: date
                    example: '2004-03-29'
                phone_number:
                    type: string

        Post:
            type: object
            required:
                - id
                - title
                - description
                - isPrivate
                - creatorId
                - tags
                - createdAt
                - updatedAt
            properties:
                id:
                    type: string
                    format: uuid
                title:
                    type: string
                description:
                    type: string
                isPrivate:
                    type: string
                creatorId:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    example: '2004-03-29 12:30'
                updatedAt:
                    type: string
                    example: '2004-03-29 12:30'

        PostId:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid

        EditPostRequest:
            type: object
            required:
                - id
                - title
                - description
                - isPrivate
                - tags
            properties:
                id:
                    type: string
                    format: uuid
                title:
                    type: string
                description:
                    type: string
                isPrivate:
                    type: string
                tags:
                    type: array
                    items:
                        type: string

        PaginatedPostsRequest:
            type: object
            required:
                - page
                - pagesize
            properties:
                page:
                    type: number
                pagesize:
                    type: number
                tags:
                    type: array
                    items:
                        type: string

        PostsList:
            type: object
            required:
                - posts
            properties:
                posts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Post'

        CreatePostRequest:
            type: object
            required:
                - title
                - description
                - isPrivate
                - tags
            additionalProperties: false
            properties:
                title:
                    type: string
                description:
                    type: string
                isPrivate:
                    type: string
                tags:
                    type: array
                    items:
                        type: string

        CreateCommentRequest:
            type: object
            required:
                - postId
                - text
            properties:
                postId:
                    type: string
                    format: uuid
                text:
                    type: string
        
        PaginatedCommentsRequest:
            type: object
            required:
                - postId
                - page
                - pagesize
            properties:
                postId:
                    type: string
                    format: uuid
                page:
                    type: number
                pagesize:
                    type: number
        
        Comment:
            type: object
            required:
                - id
                - postId
                - text
                - createdAt
                - userId
            properties:
                id:
                    type: string
                    format: uuid
                postId:
                    type: string
                    format: uuid
                text:
                    type: string
                createdAt:
                    type: string
                    example: '2004-03-29 12:30'
                userId:
                    type: string
                    format: uuid

        CommentsList:
            type: object
            required:
                - comments
            properties:
                comments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Comment'
        
        PostStatsRequest:
            type: object
            required:
                - postId
            properties:
                postId:
                    type: string
                    format: uuid
            
        PostStats:
            type: object
            required:
                - views
                - likes
                - comments
            properties:
                views:
                    type: integer
                    format: int64
                likes:
                    type: integer
                    format: int64
                comments:
                    type: integer
                    format: int64

        PostDynamicsRequest:
            type: object
            required:
                - postId
            properties:
                postId:
                    type: string
                    format: uuid

        Dynamic:
            type: object
            required:
                - date
                - value
            properties:
                date:
                    type: string
                value:
                    type: integer

        PostDynamics:
            type: object
            required:
                - views
                - likes
                - comments
            properties:
                views:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dynamic'
                likes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dynamic'
                comments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dynamic'
        
        TopPostsRequest:
            type: object
            required:
                - param
            properties:
                param:
                    type: string
                    enum:
                        - views
                        - likes
                        - comments

        TopPostsItem:
            type: object
            required:
                - post_id
                - views
                - likes
                - comments
            properties:
                post_id:
                    type: string
                    format: uuid
                views:
                    type: integer
                likes:
                    type: integer
                comments:
                    type: integer
            
        TopPosts:
            type: object
            required:
                - posts
            properties:
                posts:
                    type: array
                    items:
                        $ref: '#/components/schemas/TopPostsItem'

        TopUsersRequest:
            type: object
            required:
                - param
            properties:
                param:
                    type: string
                    enum:
                        - views
                        - likes
                        - comments
        
        TopUsersItem:
            type: object
            required:
                - user_id
                - views
                - likes
                - comments
            properties:
                user_id:
                    type: string
                    format: uuid
                views:
                    type: integer
                likes:
                    type: integer
                comments:
                    type: integer
        
        TopUsers:
            type: object
            required:
                - users
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/TopUsersItem'
